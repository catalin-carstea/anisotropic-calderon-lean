name = "openai_calderon"
defaultTargets = ["CalderonFormalization"]
allowNonModules = true

[leanOptions]
maxHeartbeats = 200000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f6090c7095e1e56b3464c1daba5f24631f1290d2"

[[lean_lib]]
name = "CalderonFormalization"
roots = ["OAI.Analysis.AnisotropicCalderon.Main"]
globs = ["Calderon.+", "OAI.+", "TauCeti.+"]

[[lean_lib]]
name = "ComparatorChallenges"
globs = ["ComparatorChallenges.+"]
